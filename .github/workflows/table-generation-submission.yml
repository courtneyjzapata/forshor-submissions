name: Table submission

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
    # CLI/reporting/docs-only maintenance is not a table submission. Mixed changes still
    # trigger the trusted verifier, which rejects every disallowed file.
    paths-ignore:
      - forshor
      - scripts/test_contributor_cli.py
      - scripts/ci/publication.js
      - scripts/ci/pr_publication.js
      - scripts/test_publication.js
      - scripts/test_pr_publication.js
      - .github/workflows/publish-results.yml
      - .github/workflows/contributor-cli.yml
      - .github/workflows/table-generation-submission.yml
      - README.md
      - docs/CLI.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: table-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify table with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Private sprint: one active verifier; retain up to 100 waiting runs.
    # The workflow-level PR group still cancels superseded commits.
    concurrency:
      group: forshor-verification
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read

    steps:
      - name: Checkout submission
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          path: submission
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout verifier
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Read benchmark config
        id: scoring
        working-directory: verifier
        run: python3 -m scripts.ci.export_benchmark_config >> "$GITHUB_OUTPUT"

      # All three take well under a second and run against the trusted verifier
      # checkout, not the submission. They cover the scanner hardening that
      # stops a banned token being hidden in a string, raw-string or character
      # literal; the import and namespace preflight that keeps a promoted policy
      # buildable; and the containment that keeps every admitted file inside the
      # source archive.
      - name: Check verifier hardening and archive completeness
        working-directory: verifier
        run: |
          python3 scripts/test_verifier_hardening.py
          python3 scripts/test_submission_preflight.py
          python3 scripts/test_archive_completeness.py
          python3 scripts/test_verifier_deadline.py

      - name: Run verifier preflight
        working-directory: submission
        env:
          TABLE_GEN_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TABLE_GEN_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TABLE_GEN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TABLE_GEN_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          TABLE_GEN_TARGETS: ${{ steps.scoring.outputs.targets }}
          TABLE_GEN_SCORE_WEIGHTS: ${{ steps.scoring.outputs.weights }}
        run: |
          python3 ../verifier/scripts/verifier.py --out-dir artifacts --preflight-only

      - name: Reuse an identical accepted verification
        id: reuse
        working-directory: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/verification_identity.py --head "$SUBMISSION_HEAD" --reuse ../submission/artifacts >> "$GITHUB_OUTPUT"

      - name: Install Lean
        if: steps.reuse.outputs.reused != 'true'
        # From the trusted `verifier` checkout, never the fork's tree.
        working-directory: verifier
        run: ./scripts/ci/install_lean.sh

      # Restore the build cache produced by `lean-build-cache.yml` on `main`.
      #
      # READ ONLY, deliberately. This job compiles untrusted fork-supplied Lean,
      # so it must never write a cache another run could restore. Only the
      # trusted `main` workflow writes.
      #
      # Restoring a `main` build into the submission tree is sound because the
      # preflight step above has already run, and it rejects any diff outside
      # `TableGeneration/Submission/`. Everything the cache covers is therefore
      # byte-identical to the base branch, and Lake's traces force a rebuild of
      # exactly the submission modules, which is the work we actually want.
      #
      # The key is computed from the VERIFIER checkout (the trusted base), not
      # the submission checkout, so a fork cannot steer which cache it gets.
      - name: Restore Lean dependency cache
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('verifier/lake-manifest.json', 'verifier/lean-toolchain') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-

      # A cache's version is a hash of its `path`. `lean-build-cache.yml` saves
      # from the repository root, so the entry has to be restored at the same
      # relative path and then moved into the checkout.
      - name: Move restored dependencies into the checkout
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          if [ -d .lake/packages ]; then
            mkdir -p submission/.lake
            rm -rf submission/.lake/packages
            mv .lake/packages submission/.lake/packages
            echo "restored dependency tree into submission/.lake/packages"
          else
            echo "no dependency cache restored"
          fi

      # No `lake exe cache get` here. The verifier builds
      # `TableGeneration.Submission.Correctness` and `TableGeneration.Metrics`,
      # and nothing in the import closure of either reaches Mathlib, so the
      # Mathlib oleans this fetched were never loaded. Promotion still fetches
      # them, because it builds the whole library.

      - name: Restore Lean build cache
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('verifier/lean-toolchain', 'verifier/lakefile.lean', 'verifier/lake-manifest.json', 'verifier/TableGeneration.lean', 'verifier/TableGeneration/**/*.lean') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Move restored build into the checkout
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          if [ -d .lake/build ]; then
            mkdir -p submission/.lake
            rm -rf submission/.lake/build
            mv .lake/build submission/.lake/build
            echo "restored build tree into submission/.lake/build"
          else
            echo "no build cache restored"
          fi

      # Needs Lean and the restored build cache, so it sits after both, and
      # still ahead of the verifier's own `lake build`.
      #
      # The script and the gate come from the TRUSTED verifier checkout; only
      # the working directory is the submission, because that is where the
      # caches were moved and so the only tree `lake env` can resolve in. The
      # preflight step above has already rejected any diff outside
      # `TableGeneration/Submission/Policy{,/**}`, so the `lakefile.lean` and
      # `lean-toolchain` that `lake env` reads here are the base branch's.
      - name: Build the trusted parser imports on a cold runner
        if: steps.reuse.outputs.reused != 'true'
        # Preflight has established these protected modules equal the trusted
        # base. No submitted Policy/helper is compiled here. A new private repo
        # cannot assume the upstream repository's build cache exists.
        working-directory: submission
        run: lake build TableGeneration.Policy TableGeneration.Baseline TableGeneration.Metrics TableGeneration.Spec

      - name: Check the submission syntax gate
        if: steps.reuse.outputs.reused != 'true'
        working-directory: submission
        run: python3 ../verifier/scripts/test_submission_syntax_gate.py

      - name: Run verifier
        if: steps.reuse.outputs.reused != 'true'
        working-directory: submission
        env:
          TABLE_GEN_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TABLE_GEN_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          TABLE_GEN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TABLE_GEN_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          TABLE_GEN_TARGETS: ${{ steps.scoring.outputs.targets }}
          TABLE_GEN_SCORE_WEIGHTS: ${{ steps.scoring.outputs.weights }}
        run: |
          python3 ../verifier/scripts/verifier.py --out-dir artifacts

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: table-generation-submission-${{ github.run_id }}-${{ github.run_attempt }}
          path: submission/artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Show verification outcome
        if: always()
        run: |
          if [ -f submission/artifacts/table-generation-summary.md ]; then
            cat submission/artifacts/table-generation-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f submission/artifacts/reused-verification.json ]; then
            echo 'An identical accepted commit and verification configuration were reused. Lean was not rerun.' >> "$GITHUB_STEP_SUMMARY"
          fi
