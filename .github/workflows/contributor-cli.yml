name: Check contributor CLI and publication reporting
on:
  push:
    branches: [main]
    paths: [forshor, scripts/test_contributor_cli.py, scripts/test_check_banded_policy_fast.py, 'scripts/ci/**', scripts/policy_verifier.py, scripts/memcap.py, scripts/tree_copy.py, scripts/check_banded_policy.py, evaluation/intake_v2.py, scripts/test_policy_verifier.py, scripts/test_publication.js, scripts/test_pr_publication.js, scripts/test_policy_publication.js, '.github/actions/policy-*/**', .github/workflows/policy-build-cache.yml, .github/workflows/policy-build-cache-backup.yml, .github/workflows/table-generation-submission.yml, .github/workflows/publish-results.yml, .github/workflows/contributor-cli.yml]
  pull_request:
    branches: [main]
    paths: [forshor, scripts/test_contributor_cli.py, scripts/test_check_banded_policy_fast.py, 'scripts/ci/**', scripts/policy_verifier.py, scripts/memcap.py, scripts/tree_copy.py, scripts/check_banded_policy.py, evaluation/intake_v2.py, scripts/test_policy_verifier.py, scripts/test_publication.js, scripts/test_pr_publication.js, scripts/test_policy_publication.js, '.github/actions/policy-*/**', .github/workflows/policy-build-cache.yml, .github/workflows/policy-build-cache-backup.yml, .github/workflows/table-generation-submission.yml, .github/workflows/publish-results.yml, .github/workflows/contributor-cli.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python3 -m pip install pytest==9.1.1
      - run: python3 -m pytest scripts/test_check_banded_policy_fast.py -q
      - run: python3 scripts/test_contributor_cli.py
      - run: python3 -m py_compile forshor
      - run: node scripts/test_report_trust.js
      - run: node --test scripts/test_publication.js scripts/test_pr_publication.js scripts/test_policy_publication.js
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: python3 scripts/test_policy_verifier.py
