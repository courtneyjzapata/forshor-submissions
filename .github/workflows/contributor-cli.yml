name: Check contributor CLI and publication reporting
on:
  push:
    branches: [main]
    paths: [forshor, scripts/test_contributor_cli.py, scripts/ci/publication.js, scripts/ci/pr_publication.js, scripts/test_publication.js, scripts/test_pr_publication.js, .github/workflows/publish-results.yml, .github/workflows/contributor-cli.yml]
  pull_request:
    branches: [main]
    paths: [forshor, scripts/test_contributor_cli.py, scripts/ci/publication.js, scripts/ci/pr_publication.js, scripts/test_publication.js, scripts/test_pr_publication.js, .github/workflows/publish-results.yml, .github/workflows/contributor-cli.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/test_contributor_cli.py
      - run: python3 -m py_compile forshor
      - run: node scripts/test_report_trust.js
      - run: node --test scripts/test_publication.js scripts/test_pr_publication.js
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
